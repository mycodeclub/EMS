# Local development database. Start with: docker compose up -d
services:
  postgres:
    image: postgres:17
    container_name: ems-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ems
      POSTGRES_USER: ems
      POSTGRES_PASSWORD: ems_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ems-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ems -d ems"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ems-pgdata:
